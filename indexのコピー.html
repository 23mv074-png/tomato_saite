  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tomatoma</title>

  <link rel="stylesheet" href="CSS/style.css">

<body>

  <div class="bg-image"></div>


  <header>
    <div class="logo">
      Tomatto
    </div>

    <nav>
      <ul>
        <li><a href="#">ABOUT</a></li>
        <li><a href="#">VARIETY</a></li>
        <li><a href="#">RECIPE</a></li>
        <li><a href="#">CONTACT</a></li>
      </ul>
    </nav>

    <a href="#" class="menu-btn">
      MENU
    </a>

  </header>

<main>

  <section class="hero-area">

    <img src="images/left-up-tomato.svg" class="tomato tomato1" alt="左上のトマト">
    <img src="images/left-mini-tomato.svg" class="tomato tomato2" alt="小さいトマト">
    <img src="images/left-down-tomato.svg" class="tomato tomato3" alt="左下のトマト">
    <img src="images/right-tomato.svg" class="tomato tomato4" alt="右上のトマト">

    <div class="container">

      <section class="hero">

    <div class="hero-main">

        <p class="catch">
            美味しいトマト、毎日をもっと好きになる。
        </p>

        <h1 class="title">
            <span>と</span>
            <span>ま</span>
            <span>と</span>
        </h1>

        <p class="text">
            太陽の恵みをたっぷり浴びたトマトは、<br>
            みずみずしくて栄養たっぷり。<br>
            トマトの魅力や美味しい食べ方をご紹介します。
        </p>

        <a href="#" class="about-btn">
            ABOUT TOMATO
        </a>

    </div>

    <aside class="pickup">

        <!-- PICK UP -->

    </aside>

</section>

    

<section class="about-area">

  <div class="container">

    <!-- ABOUT -->
    <section class="about section" id="about">

      <div class="about-content">

        <h2 class="section-title">
          ABOUT TOMATO
        </h2>

        <p class="section-subtitle">
          トマトの魅力
        </p>

        <p class="about-text">
          太陽の光をたっぷり浴びて育ったトマト。
          甘みや酸味、栄養など様々な魅力があります。
        </p>

        <a href="#" class="btn">
          MORE
        </a>

      </div>

      <div class="about-image"></div>

    </section>



    <!-- VARIETY -->
    <section class="variety section" id="variety">

      <!-- 後で作る -->

    </section>

  </div>

</section>

  <section class="recipe-area">

    <div class="container">

      <section class="recipe section" id="recipe">

      </section>

      <section class="news section" id="news">

      </section>

      <section class="instagram section" id="instagram">

      </section>

      <section class="contact section" id="contact">

      </section>

    </div>

  </section>
</main>
  

  <footer>
    
  </footer>
